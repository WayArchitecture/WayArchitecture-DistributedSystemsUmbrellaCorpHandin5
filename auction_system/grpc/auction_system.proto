
syntax = "proto3";
option go_package = "auction_system/grpc/proto";

message Nothing {}

message Amount {
    int64 amount = 1;
}

message Acknowledgement {
    string status = 1;  //fail, success, exception
}

message Outcome {
    int64 highestBid = 1;
    bool isOver = 2;
}

message Node {
    int32 id = 1;
    string address = 2;
    bool isLeader = 3;
}

message Client {
    string address = 1;
}

message Clients {
    repeated Client clients = 1;
}

message PrimaryState {
    int32 highestBid = 1;
    Clients clients = 2;
    int32 auctionEndTime = 3;
    int32 uniqueIdentifier = 4;
}

message Candidate {
    int32 id = 1;
    int32 electionNumber = 2;
}

message ElectionState {
    int32 highestBid = 1;
    int32 auctionEndTime = 2;
}

service AuctionService {
    rpc RegisterBackupNode(Node) returns (Node);
    rpc PingPrimaryNodeFromBackup(Nothing) returns (Nothing);
    rpc RegisterClient(Nothing) returns (Node);
    rpc Bid(Amount) returns (Acknowledgement);
    rpc Result(Nothing) returns (Outcome);

    rpc PrimaryUpdateToBackup(PrimaryState) returns (Nothing);
    rpc StartElection(Candidate) returns (Nothing);
    rpc CompareCandidate(Candidate) returns (Candidate);
    rpc CompareState(ElectionState) returns (ElectionState);
    rpc ElectLeader(Candidate) returns (Nothing);
}
